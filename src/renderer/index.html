<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oro — AI Second Brain</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <!-- Google Fonts: Google Sans Text, Google Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;600;700&family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #0a0a0a;
        --bg-surface: #121212;
        --bg-surface-hi: #1c1c1c;
        --border: #262626;
        --border-subtle: #1e1e1e;
        --border-focus: #ffffff;
        --accent: #ffffff;
        --accent-soft: rgba(255, 255, 255, 0.08);
        --text: #ffffff;
        --text-muted: #a3a3a3;
        --text-subtle: #555555;
        --cyan: #e5e5e5;
        --green: #22c55e;
        --purple: #d4d4d4;
        --red: #ef4444;
        --orange: #ffffff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        background-color: var(--bg-canvas);
        color: var(--text);
        font-family: var(--system-font, 'Google Sans Text', 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
        font-weight: 450;
      }
      input, textarea, button, select, [contenteditable="true"] {
        user-select: text;
        font-family: var(--system-font, 'Google Sans Text', 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
        font-weight: 450;
      }
      /* Custom subtle unified scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
